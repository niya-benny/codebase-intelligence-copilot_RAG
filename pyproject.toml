[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codebase-intelligence-copilot"
version = "0.1.0"
description = "Local-first, citation-grounded retrieval for source code"
requires-python = ">=3.11"
dependencies = [
    "tree-sitter>=0.25,<0.27",
    "tree-sitter-javascript>=0.23,<0.27",
]

[project.scripts]
rag-copilot = "rag_copilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
